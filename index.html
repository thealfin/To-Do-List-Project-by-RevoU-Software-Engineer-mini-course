<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ─────────────────────────── HEADER ─────────────────────────── -->
  <header class="topbar">
    <div class="topbar-left">
      <span id="live-time" class="topbar-time"></span>
      <span id="live-date" class="topbar-date"></span>
    </div>
    <div class="topbar-right">
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle Light / Dark">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ─────────────────────────── MAIN ─────────────────────────── -->
  <main class="dashboard">

    <!-- GREETING CARD -->
    <section class="card greeting-card" aria-label="Greeting">
      <p id="greeting-text" class="greeting-sub"></p>
      <h1 id="greeting-name" class="greeting-name"></h1>
      <!-- Custom Name Modal Trigger -->
      <button id="edit-name-btn" class="link-btn" aria-label="Change your name">Edit name</button>
    </section>

    <!-- FOCUS TIMER CARD -->
    <section class="card timer-card" aria-label="Focus Timer">
      <div class="card-header">
        <h2 class="card-title">Focus Timer</h2>
        <!-- Pomodoro duration selector (Challenge: Change Pomodoro time) -->
        <div class="timer-duration-wrap">
          <label for="pomo-duration" class="sr-only">Pomodoro Duration (minutes)</label>
          <input id="pomo-duration" type="number" min="1" max="120" value="25" class="duration-input" aria-label="Set timer duration in minutes" />
          <span class="duration-unit">min</span>
        </div>
      </div>

      <div class="timer-ring-wrap" role="timer" aria-live="polite">
        <svg class="timer-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="54"/>
          <circle id="ring-progress" class="ring-progress" cx="60" cy="60" r="54"/>
        </svg>
        <span id="timer-display" class="timer-display">25:00</span>
      </div>

      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">Start</button>
        <button id="timer-stop"  class="btn btn-outline">Stop</button>
        <button id="timer-reset" class="btn btn-ghost">Reset</button>
      </div>

      <p id="timer-status" class="timer-status"></p>
    </section>

    <!-- TO-DO LIST CARD -->
    <section class="card todo-card" aria-label="To-Do List">
      <div class="card-header">
        <h2 class="card-title">Tasks</h2>
        <div class="todo-toolbar">
          <!-- Sort tasks (Challenge: Sort tasks) -->
          <select id="sort-select" class="sort-select" aria-label="Sort tasks">
            <option value="default">Default</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="done">Done last</option>
          </select>
        </div>
      </div>

      <form id="todo-form" class="todo-form" autocomplete="off">
        <input id="todo-input" type="text" placeholder="Add a new task…" class="input" maxlength="120" aria-label="New task" />
        <button type="submit" class="btn btn-primary" aria-label="Add task">Add</button>
      </form>

      <ul id="todo-list" class="todo-list" role="list" aria-label="Task list"></ul>

      <p id="todo-empty" class="empty-state" aria-live="polite">No tasks yet. Add one above ↑</p>
    </section>

    <!-- QUICK LINKS CARD -->
    <section class="card links-card" aria-label="Quick Links">
      <div class="card-header">
        <h2 class="card-title">Quick Links</h2>
        <button id="add-link-btn" class="icon-btn" aria-label="Add new link" title="Add link">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>

      <div id="links-grid" class="links-grid" role="list" aria-label="Quick links"></div>
      <p id="links-empty" class="empty-state">No links yet. Click + to add one.</p>
    </section>

  </main>

  <!-- ─────────────── MODAL: Custom Name ─────────────── -->
  <div id="modal-name" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-name-title" hidden>
    <div class="modal">
      <h3 id="modal-name-title" class="modal-title">What should I call you?</h3>
      <input id="name-input" type="text" class="input" placeholder="Enter your name…" maxlength="40" aria-label="Your name" />
      <div class="modal-actions">
        <button id="modal-name-cancel" class="btn btn-ghost">Cancel</button>
        <button id="modal-name-save"   class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- ─────────────── MODAL: Add / Edit Link ─────────────── -->
  <div id="modal-link" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-link-title" hidden>
    <div class="modal">
      <h3 id="modal-link-title" class="modal-title">Add Quick Link</h3>
      <label class="field-label" for="link-label-input">Label</label>
      <input id="link-label-input" type="text" class="input" placeholder="e.g. GitHub" maxlength="30" aria-label="Link label" />
      <label class="field-label" for="link-url-input">URL</label>
      <input id="link-url-input" type="url" class="input" placeholder="https://…" aria-label="Link URL" />
      <div class="modal-actions">
        <button id="modal-link-cancel" class="btn btn-ghost">Cancel</button>
        <button id="modal-link-save"   class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- ─────────────── MODAL: Edit Task ─────────────── -->
  <div id="modal-task" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-task-title" hidden>
    <div class="modal">
      <h3 id="modal-task-title" class="modal-title">Edit Task</h3>
      <input id="task-edit-input" type="text" class="input" maxlength="120" aria-label="Edit task text" />
      <div class="modal-actions">
        <button id="modal-task-cancel" class="btn btn-ghost">Cancel</button>
        <button id="modal-task-save"   class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
